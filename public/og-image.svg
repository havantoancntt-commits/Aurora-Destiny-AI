<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="50%" stop-color="#090b14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Celestial Grid Lines -->
  <circle cx="600" cy="315" r="460" stroke="#ffffff" stroke-opacity="0.04" fill="none" stroke-width="1.5" />
  <circle cx="600" cy="315" r="340" stroke="#ffffff" stroke-opacity="0.06" fill="none" stroke-width="1" />
  <circle cx="600" cy="315" r="220" stroke="#2dd4bf" stroke-opacity="0.12" fill="none" stroke-width="1.5" stroke-dasharray="6,8" />
  <circle cx="600" cy="315" r="100" stroke="#fbbf24" stroke-opacity="0.2" fill="none" stroke-width="2" />

  <!-- Astrological 12 Division Spokes -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="600" y1="35" x2="600" y2="595" />
    <line x1="140" y1="315" x2="1060" y2="315" />
    <line x1="275" y1="127" x2="925" y2="503" />
    <line x1="275" y1="503" x2="925" y2="127" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="180" r="140" fill="#2dd4bf" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="420" r="160" fill="#818cf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="315" r="80" fill="#fbbf24" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Top Badge: Kênh Huyền Phong Phật Đạo -->
  <g transform="translate(600, 110)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="2">
      ★ KÊNH HUYỀN PHONG PHẬT ĐẠO • GIÁO SƯ PROF.TOAN ★
    </text>
  </g>

  <!-- Central Title: AURORA DESTINY AI -->
  <text x="600" y="240" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="58" font-weight="800" fill="url(#auroraGrad)" letter-spacing="4">
    AURORA DESTINY AI
  </text>

  <!-- Subtitle: Siêu Trí Tuệ Nhân Tạo & Thiên Văn Mệnh Lý -->
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" letter-spacing="1">
    Bát Tự Tứ Trụ • Tử Vi Đẩu Số 108 Tinh Bàn • Hợp Xướng 7 AI Multi-Agent
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 375)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-22" width="190" height="44" rx="12" fill="#0b1329" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">
        ✓ 108 Tinh Bàn Chuẩn Xác
      </text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="12" fill="#0b1329" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">
        ✓ Giờ Sinh Chân Mặt Trời
      </text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(130, 0)">
      <rect x="-105" y="-22" width="210" height="44" rx="12" fill="#0b1329" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fcd34d">
        ✓ 24 Tiết Khí VSOP87
      </text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(365, 0)">
      <rect x="-100" y="-22" width="200" height="44" rx="12" fill="#0b1329" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">
        ✓ Bảo Mật Tuyệt Đối 100%
      </text>
    </g>
  </g>

  <!-- Bottom Authority Bar -->
  <g transform="translate(600, 520)">
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      Phụng sự văn hóa tri thức truyền thống &amp; Khoa học chiêm nghiệm • https://auroradestiny.ai
    </text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#64748b">
      Xác thực mã hóa thuật toán độc quyền Giáo Sư - Prof.TOAN • Kênh Huyền Phong Phật Đạo
    </text>
  </g>
</svg>
