name: CI/CD Pipeline - Aurora Destiny AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-verify:
    name: Node ${{ matrix.node-version }} - Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Clean Dependencies from Lockfile
        run: npm ci

      - name: Typecheck (TypeScript Static Analysis)
        run: npm run lint

      - name: Run Full Test Suite (Unit, Integration, Security, Engine Determinism)
        run: npm test
        env:
          NODE_ENV: test
          ALGORITHM_PROTECTION_SECRET: github_ci_high_entropy_algo_protect_9f8e7d6c5b4a3120
          PAYMENT_WEBHOOK_SECRET: github_ci_high_entropy_webhook_hmac_8a7b6c5d4e3f2119
          APP_SECRET: github_ci_high_entropy_app_auth_seal_7b8c9d0e1f2a3b4c
          SESSION_SECRET: github_ci_high_entropy_session_crypt_6a5b4c3d2e1f0987

      - name: Production Build (Vite Client + Node Server Bundle)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs missing"; exit 1; }
          test -d dist/migrations || { echo "dist/migrations missing"; exit 1; }
          echo "All production build artifacts verified successfully."

  bun-audit-and-verify:
    name: Bun Runtime - Frozen Lockfile, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Clean Dependencies via Bun Lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck (TypeScript Static Analysis)
        run: bun run typecheck

      - name: Run Full Test Suite
        run: bun run test
        env:
          NODE_ENV: test
          ALGORITHM_PROTECTION_SECRET: github_ci_high_entropy_algo_protect_9f8e7d6c5b4a3120
          PAYMENT_WEBHOOK_SECRET: github_ci_high_entropy_webhook_hmac_8a7b6c5d4e3f2119
          APP_SECRET: github_ci_high_entropy_app_auth_seal_7b8c9d0e1f2a3b4c
          SESSION_SECRET: github_ci_high_entropy_session_crypt_6a5b4c3d2e1f0987

      - name: Production Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs missing"; exit 1; }
          test -d dist/migrations || { echo "dist/migrations missing"; exit 1; }
          echo "All production build artifacts verified successfully under Bun."
