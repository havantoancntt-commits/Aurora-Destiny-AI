name: CI/CD Pipeline - Aurora Destiny AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-verify:
    name: Node ${{ matrix.node-version }} - Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Clean Dependencies from Lockfile
        run: npm ci

      - name: Typecheck (TypeScript Static Analysis)
        run: npm run lint

      - name: Run Full Test Suite (Unit, Integration, Security, Engine Determinism)
        run: npm test
        env:
          NODE_ENV: test
          ALGORITHM_PROTECTION_SECRET: github_actions_ci_testing_secret_key_32bytes_minimum
          PAYMENT_WEBHOOK_SECRET: github_actions_ci_webhook_secret_key_32bytes_min

      - name: Production Build (Vite Client + Node Server Bundle)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs missing"; exit 1; }
          echo "All production build artifacts verified successfully."
